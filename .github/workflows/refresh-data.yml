name: refresh-data
on:
  schedule:
    # The same four firings as "45 */6 * * *", split into two entries so the
    # checks below can tell the slots apart: github.event.schedule carries the
    # triggering cron string verbatim. 06:45 is the anchor because it sits
    # after both the CMEMS daily publication (~03:10-03:24 UTC) and GFS 00z
    # (~03:30-05:00 UTC).
    - cron: "45 6 * * *"         # anchor: ocean refresh + the only slot at REFRESH_CADENCE=daily
    - cron: "45 0,12,18 * * *"   # the other slots — GFS/GFS-Wave only, dropped when cadence is daily
  workflow_dispatch: {}          # manual "Run workflow" button, always runs everything
permissions:
  contents: read
concurrency:
  group: refresh-data
  cancel-in-progress: false   # never kill a half-finished upload
jobs:
  refresh:
    # 6-hourly by default: every slot runs. Set the repo variable
    # REFRESH_CADENCE=daily to keep only the 06:45 UTC anchor slot. Manual
    # dispatch always runs. Comparing cron strings rather than the wall clock
    # keeps this correct however late GitHub starts a run, and a dropped slot
    # costs no runner.
    if: >-
      github.event_name != 'schedule'
      || github.event.schedule == '45 6 * * *'
      || vars.REFRESH_CADENCE != 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 20   # observed runtime ~4 min; kills a hung run well before the next slot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install GRIB + CMEMS tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libeccodes-dev   # pygrib's GRIB decoder backend
          pip install pygrib numpy copernicusmarine
      - name: Refresh GFS atmosphere (anonymous)
        run: |
          for p in surface 1000hpa 500hpa 10hpa temperature rh dew; do
            python scripts/refresh_wind.py "$p"
          done
      - name: Refresh GFS-Wave (anonymous)
        run: python scripts/refresh_waves.py
      - name: Refresh CMEMS ocean (credentials)
        # The CMEMS products are P1D-m daily means published once per day, so
        # only the anchor slot fetches them — the other slots would re-download
        # an identical field. Skipping this step just leaves the 3 ocean JSONs
        # unwritten, so the upload glob ships 9 files and the bucket keeps the
        # previous ocean objects.
        if: github.event_name != 'schedule' || github.event.schedule == '45 6 * * *'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/refresh_ocean.py
      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ./scripts/upload_data.sh
